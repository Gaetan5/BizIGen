name: Dependency Updates

on:
  schedule:
    # Run weekly on Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  # ============================================
  # Check for outdated dependencies
  # ============================================
  check-outdated:
    name: Check Outdated Dependencies
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Check outdated npm packages
        run: |
          bun outdated || true
        continue-on-error: true
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Check outdated pip packages
        run: |
          pip install pip-outdated
          pip-outdated mini-services/api-service/requirements.txt || true
        continue-on-error: true

  # ============================================
  # Security audit
  # ============================================
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
      
      - name: Run pip audit
        run: |
          pip install pip-audit
          cd mini-services/api-service && pip-audit -r requirements.txt
        continue-on-error: true

  # ============================================
  # Auto-update dependencies (PR)
  # ============================================
  auto-update:
    name: Auto Update Dependencies
    needs: [check-outdated, security-audit]
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Update dependencies
        run: |
          bun update
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git diff --quiet || git commit -am "chore: auto-update dependencies"
          git push
        continue-on-error: true
