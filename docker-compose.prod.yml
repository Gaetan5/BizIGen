# ==============================================================================
# BizGen AI - Docker Compose Configuration (Production & Staging)
# Hardened multi-service stack with Nginx Reverse Proxy, isolated database & redis
# ==============================================================================

services:
  # Nginx Reverse Proxy (Frontend & API gateway on 80/443)
  nginx:
    image: nginx:alpine
    container_name: bizgen-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - bizgen-network

  # Next.js Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bizgen-frontend-prod
    restart: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-bizgen}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bizgen}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - PYTHON_BACKEND_URL=http://api:3001
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - bizgen-network

  # FastAPI Backend
  api:
    build:
      context: ./mini-services/api-service
      dockerfile: Dockerfile
      target: production
    container_name: bizgen-api-prod
    restart: always
    expose:
      - "3001"
    environment:
      - APP_NAME=BizGen AI API
      - API_PORT=3001
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-bizgen}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bizgen}
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-gpt-4o-mini}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_BASIC_PRICE_ID=${STRIPE_BASIC_PRICE_ID:-}
      - STRIPE_PRO_PRICE_ID=${STRIPE_PRO_PRICE_ID:-}
      - FLUTTERWAVE_SECRET_KEY=${FLUTTERWAVE_SECRET_KEY:-}
      - FLUTTERWAVE_PUBLIC_KEY=${FLUTTERWAVE_PUBLIC_KEY:-}
      - FLUTTERWAVE_WEBHOOK_HASH=${FLUTTERWAVE_WEBHOOK_HASH:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM:-}
    volumes:
      - api-logs:/app/logs
      - api-exports:/app/exports
      - ./mini-services/api-service/knowledge:/app/knowledge:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bizgen-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # PostgreSQL Database (ISOLATED - NOT EXPOSED TO HOST)
  postgres:
    image: postgres:16-alpine
    container_name: bizgen-postgres-prod
    restart: always
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-bizgen}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-bizgen}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./mini-services/api-service/migrations/postgres_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - bizgen-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bizgen} -d ${POSTGRES_DB:-bizgen}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis Cache (ISOLATED - NOT EXPOSED TO HOST)
  redis:
    image: redis:7-alpine
    container_name: bizgen-redis-prod
    restart: always
    expose:
      - "6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - bizgen-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  bizgen-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  api-logs:
  api-exports:
